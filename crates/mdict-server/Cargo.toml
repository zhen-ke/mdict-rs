[package]
name = "mdict-rs"
version = "0.1.0"
authors = ["zhimoe"]
edition.workspace = true
description = "基于 mdict-core 的 MDX/MDD 词典 Web 服务"

[[bin]]
name = "mdict-rs"
path = "src/main.rs"

[dependencies]
mdict-core = { path = "../mdict-core" }
anyhow = "1"
serde_derive = "1"
serde = "1"
adler32 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rand = "0.9"
ripemd = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2.0.5"
serde_json = "1.0.148"
toml = "0.8"
rayon = "1"
moka = { version = "0.12.15", features = ["sync"] }
# 后台建索引线程池：可控线程数 + 低优先级，避免在弱设备上吃满核
# 抢占 Web 服务的查询线程。
thread-priority = "0.16"
# 词典目录热更新：监听新增/变更的 .mdx/.mdd/.toml，增量建索引并热替换 catalog。
notify = "6"
# catalog 热替换的 lock-free 双 buffer：查询热路径读不取锁、热更新写原子换论文。
arc-swap = "1"
